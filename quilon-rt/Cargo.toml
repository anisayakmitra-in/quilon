[package]
name = "quilon-rt"
version = "0.9.1"
edition = "2024"
authors = ["Assaf Sapir <assaf@sapir.io>"]
description = "Quilon runtime intrinsics, linked into compiled programs (JIT and AOT)"
license = "GPL-2.0-only WITH Classpath-exception-2.0"

[lib]
# `staticlib` produces `libquilon_rt.a` for ahead-of-time-linked native binaries
# (`quilon build`, which links it in-process). `rlib` lets the `quilon` binary link the same
# symbols so the in-process JIT (`quilon run`) resolves them at the same addresses.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Grapheme-cluster counting for `Text.length`.
unicode-segmentation = "1.13"

# Concurrency substrate (single-threaded, cooperative). `corosensei` provides
# stackful fibers; `mio` provides the reactor/poll loop that drives timed waits
# (and, later, socket readiness). `libc` is used for the page size when computing
# a fiber's GC-scannable stack range.
corosensei = "0.3"
mio = { version = "1", features = ["os-poll"] }
libc = "0.2"
