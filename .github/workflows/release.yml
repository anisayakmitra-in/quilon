name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_221_PREFIX: /usr/lib/llvm-22

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 22 and system dependencies
        run: |
          set -euxo pipefail
          # Same toolchain as CI: Boehm GC + both C linkers, LLVM 22 dev libs.
          sudo apt-get update
          sudo apt-get install -y libgc-dev gcc clang
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y llvm-22-dev libpolly-22-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llc /usr/local/bin/llc
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> "$GITHUB_ENV"

      - name: Build release
        run: cargo build --release --bin quilon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: target/release/quilon
          generate_release_notes: true
          body: |
            ## Quilon ${{ github.ref_name }} — "Stable basics"

            A stable, verified **core** of the Quilon language — **not yet
            feature-complete**. Programs run via `quilon run` (in-process LLVM
            JIT) or compile to a self-contained native executable via
            `quilon build`.

            Highlights: `^` entry point (implicit exit-0; receives
            `args :: []Text` / `env :: [][]Text`), `<<`/`>>` modules
            (`core.io` / `core.test` / `core.cli`), `|>` first-argument-injection
            pipe, the built-in `Text` type with methods, arrays with methods
            (`map`/`filter`/`reduce`/`each`/`find`/`at`), ranges (`lo <- hi`),
            spread (`<-`), and `+` concat, records with methods and in-place
            mutation, user-defined sum types with exhaustive pattern matching and
            typed `Num`/`Text`/`Bool` payloads, ad-hoc + operator overloading,
            closures (`=` by-value / `:=` by-reference capture), guaranteed
            self-tail-call optimization (constant-stack recursion), the `Unit`
            type (`$`), and conservative (Boehm) GC. Built against LLVM 22.

            **Known limitations:** no generics / type variables (ad-hoc
            overloading is the only polymorphism), no `while` loops, no
            higher-order use (an overloaded name or a closure passed as a value,
            parameter, or return), no string interpolation. `libgc` is linked
            dynamically. See CHANGELOG.md for the full list.

            The attached `quilon` binary is a dynamically-linked Linux x86-64
            build (requires `libgc` at runtime); `quilon build` embeds its runtime
            but still needs a C toolchain and `libgc` to link and run native
            output.
