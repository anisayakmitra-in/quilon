[package]
name = "quilon"
version = "0.9.1"
edition = "2024"
authors = ["Assaf Sapir <assaf@sapir.io>"]
description = "A fast, statically-typed web programming language"
license = "GPL-2.0-only"

[workspace]
members = ["quilon-rt"]

[dependencies]
# LLVM code generation - latest Inkwell targeting LLVM 22
inkwell = { version = "0.10", features = ["llvm22-1"] }

# Lexing
logos = "0.16"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Runtime intrinsics (GC alloc, grapheme counting, output). Linked as an rlib so
# the JIT resolves the same `#[no_mangle]` symbols it maps; also built as a
# staticlib (`libquilon_rt.a`) for ahead-of-time-linked native binaries.
quilon-rt = { path = "quilon-rt" }

# Decompressing the embedded (gzip) `libquilon_rt.a` when `quilon build` runs
# from a distributed binary. Pure-Rust backend (miniz_oxide) by default.
flate2 = "1.1"

[dev-dependencies]
# `wait4`, for the exact peak RSS the kernel recorded for a benchmarked child process.
# Already in the dependency graph; this only makes it directly visible to the benches.
libc = "0.2"

[build-dependencies]
# Compressing `libquilon_rt.a` before it is embedded into the compiler binary.
flate2 = "1.1"

# The compile-speed benchmark (`cargo bench`). Hand-timed rather than criterion: it
# reports one number per phase per corpus for trend tracking, which needs neither
# sampling machinery nor a dependency, and stays fast enough to run on every PR.
[[bench]]
name = "compile_speed"
harness = false

# The runtime benchmark (`cargo bench --bench runtime_speed`): how fast the programs the
# compiler emits actually run, and what a command costs end to end.
[[bench]]
name = "runtime_speed"
harness = false

# Build `quilon-rt` as a single codegen unit. Its `#[no_mangle]` intrinsics are
# retained only by the `#[used]` table in the crate root; across multiple codegen
# units those references are cross-CGU and do not reliably prevent per-unit
# internalization/DCE, so some intrinsics were nondeterministically dropped from
# `libquilon_rt.a` (surfacing as `undefined reference to __gc_init` at AOT link on
# some CI runners). One unit keeps the table and every intrinsic in the same object,
# making retention intra-CGU and the exported set deterministic.
[profile.dev.package.quilon-rt]
codegen-units = 1

[profile.release.package.quilon-rt]
codegen-units = 1
